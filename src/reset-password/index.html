<!doctype html>
<html lang="en">
  <head>
    <title>Reset Password</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/web/css/base.css" rel="stylesheet" />
    <link href="/web/css/app.css" rel="stylesheet" />
  </head>
  <body>
    <h1>Reset Password</h1>
    <main>
      <p id="no-token">A token is required to reset the password. Invalid URL.</p>
      <form method="post" action="/api/auth/v1/reset_password/update" hidden>
        <input type="hidden" name="password_reset_code" />
        <div>
          <label for="password">New Password</label>
          <input type="password" name="password" id="password" required />
        </div>
        <div>
          <label for="password_repeat">Confirm New Password</label>
          <input type="password" name="password_repeat" id="password_repeat" required />
        </div>
        <button type="submit">Reset Password</button>
      </form>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
